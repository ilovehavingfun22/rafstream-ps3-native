name: Build RAFSTREAM PS3 Native PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ps3-pkg:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3toolchain:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile EBOOT.BIN & Build RAFSTREAM_PS3.pkg
        run: |
          make pkg

      - name: Upload RAFSTREAM_PS3.pkg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAFSTREAM_PS3_PKG
          path: "*.pkg"
