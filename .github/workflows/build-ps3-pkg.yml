name: Build RAFSTREAM PS3 Native PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ps3-pkg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Cached PS3DEV Toolchain
        id: cache-ps3dev
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/ps3dev
          key: ps3dev-prebuilt-v5

      - name: Setup PS3DEV & PSL1GHT Toolchain
        if: steps.cache-ps3dev.outputs.cache-hit != 'true'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl python3 python-is-python3 \
            autoconf automake bison flex texinfo libncurses-dev \
            libgmp-dev libmpfr-dev libmpc-dev libssl-dev libtool pkg-config \
            zlib1g-dev bzip2 xz-utils ca-certificates jq cmake ninja-build

          sudo mkdir -p /usr/local/ps3dev
          sudo chown -R $USER:$USER /usr/local/ps3dev

          if [ ! -f "/usr/local/ps3dev/portlibs/ppu/lib/libcurl.a" ]; then
            rm -rf /tmp/ps3dev
            git clone --depth 1 https://github.com/ps3dev/ps3dev.git /tmp/ps3dev
            cd /tmp/ps3dev
            export PS3DEV=/usr/local/ps3dev
            export PSL1GHT=$PS3DEV/psl1ght
            export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin

            chmod +x ./prepare.sh ./build-all.sh ./scripts/*.sh
            ./prepare.sh || true

            for s in ./scripts/002-*.sh ./scripts/003-*.sh; do
              [ -f "$s" ] && sed -i '2i unset CFLAGS CXXFLAGS' "$s"
            done

            for s in ./scripts/003-*.sh; do
              [ -f "$s" ] && sed -i 's|./libraries.sh|rm -f scripts/*pthread-emb* \&\& ./libraries.sh|g' "$s"
            done

            export CFLAGS="-O2 -std=gnu11 -Wno-error"
            export CXXFLAGS="-O2 -std=gnu++14 -Wno-error"
            ./build-all.sh
          fi

      - name: Save PS3DEV Toolchain Cache
        if: always() && steps.cache-ps3dev.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /usr/local/ps3dev
          key: ps3dev-prebuilt-v5

      - name: Restore Cached FFmpeg Portlib
        id: cache-ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/ps3dev/portlibs/ppu
          key: ps3dev-ffmpeg-v1

      - name: Build FFmpeg for PS3 (PPU)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          set -e
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV/psl1ght
          export PORTLIBS=$PS3DEV/portlibs/ppu
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PORTLIBS/bin

          if [ ! -f "$PORTLIBS/include/libavformat/avformat.h" ]; then
            rm -rf /tmp/ffmpeg*
            if curl -fSL https://ffmpeg.org/releases/ffmpeg-4.2.9.tar.xz -o /tmp/ffmpeg.tar.xz; then
              mkdir -p /tmp/ffmpeg
              tar -xaf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
            else
              git clone --depth 1 --branch n4.2.9 https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg
            fi

            cd /tmp/ffmpeg
            COMMON_FLAGS="--prefix=$PORTLIBS \
              --enable-cross-compile \
              --cross-prefix=powerpc64-ps3-elf- \
              --arch=powerpc64 \
              --cpu=cell \
              --target-os=none \
              --enable-static \
              --disable-shared \
              --disable-programs \
              --disable-doc \
              --disable-avdevice \
              --disable-postproc \
              --disable-avfilter \
              --disable-encoders \
              --disable-muxers \
              --disable-devices \
              --disable-pthreads \
              --disable-w32threads \
              --disable-os2threads \
              --disable-altivec \
              --disable-vsx \
              --disable-asm \
              --enable-zlib"

            EXTRA_CF="-O2 -I$PSL1GHT/ppu/include -I$PORTLIBS/include"
            EXTRA_LF="-L$PSL1GHT/ppu/lib -L$PORTLIBS/lib"

            if [ -f "$PORTLIBS/lib/libmbedtls.a" ] && ./configure $COMMON_FLAGS --enable-network --enable-mbedtls --extra-cflags="$EXTRA_CF" --extra-ldflags="$EXTRA_LF" --extra-libs="-lmbedtls -lmbedx509 -lmbedcrypto -lnet -lsysmodule -lz -lm"; then
              echo "Configured FFmpeg with mbedTLS + network"
            elif ./configure $COMMON_FLAGS --enable-network --extra-cflags="$EXTRA_CF" --extra-ldflags="$EXTRA_LF" --extra-libs="-lnet -lsysmodule -lz -lm"; then
              echo "Configured FFmpeg with network"
            else
              ./configure $COMMON_FLAGS --disable-network --extra-cflags="$EXTRA_CF" --extra-ldflags="$EXTRA_LF" --extra-libs="-lz -lm"
            fi

            make -j$(nproc)
            make install
          fi

      - name: Save FFmpeg Portlib Cache
        if: always() && steps.cache-ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /usr/local/ps3dev/portlibs/ppu
          key: ps3dev-ffmpeg-v1

      - name: Compile EBOOT.BIN & Build RAFSTREAM_PS3.pkg
        run: |
          set -e
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV/psl1ght
          export PORTLIBS=$PS3DEV/portlibs/ppu
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PORTLIBS/bin

          LIBS="-ltiny3d -lrsx -lgcm_sys -ljpgdec -lpngdec -lcurl"
          [ -f "$PORTLIBS/lib/libavformat.a" ] && LIBS="$LIBS -lavformat"
          [ -f "$PORTLIBS/lib/libavcodec.a" ] && LIBS="$LIBS -lavcodec"
          [ -f "$PORTLIBS/lib/libswscale.a" ] && LIBS="$LIBS -lswscale"
          [ -f "$PORTLIBS/lib/libswresample.a" ] && LIBS="$LIBS -lswresample"
          [ -f "$PORTLIBS/lib/libavutil.a" ] && LIBS="$LIBS -lavutil"
          if [ -f "$PORTLIBS/lib/libmbedtls.a" ]; then
            LIBS="$LIBS -lmbedtls -lmbedx509 -lmbedcrypto"
          elif [ -f "$PORTLIBS/lib/libpolarssl.a" ]; then
            LIBS="$LIBS -lpolarssl"
          elif [ -f "$PORTLIBS/lib/libwolfssl.a" ]; then
            LIBS="$LIBS -lwolfssl"
          fi
          LIBS="$LIBS -lz -laudio -lnet"
          [ -f "$PSL1GHT/ppu/lib/libnetctl.a" ] && LIBS="$LIBS -lnetctl"
          LIBS="$LIBS -lio -lsysutil -lsysmodule"
          [ -f "$PSL1GHT/ppu/lib/liblv2.a" ] && LIBS="$LIBS -llv2"
          LIBS="$LIBS -lm"

          rm -rf build pkg_build rafstream_ps3.elf RAFSTREAM_PS3.pkg
          mkdir -p build pkg_build/USRDIR

          for src in source/*.c; do
            obj="build/$(basename "${src%.c}.o")"
            echo "Compiling $src -> $obj"
            powerpc64-ps3-elf-gcc -O2 -Wall -Iinclude -Isource \
              -I"$PSL1GHT/ppu/include" -I"$PORTLIBS/include" \
              -c "$src" -o "$obj"
          done

          echo "Linking rafstream_ps3.elf"
          powerpc64-ps3-elf-gcc build/*.o \
            -L"$PSL1GHT/ppu/lib" -L"$PORTLIBS/lib" \
            $LIBS -o rafstream_ps3.elf

          cp ICON0.PNG pkg_build/ICON0.PNG
          [ -f PIC1.PNG ] && cp PIC1.PNG pkg_build/PIC1.PNG || true

          FSELF_BIN=$(find "$PS3DEV" -name "make_self_npdrm" -o -name "fself.py" | head -n 1)
          SFO_BIN=$(find "$PS3DEV" -name "sfo.py" | head -n 1)
          PKG_BIN=$(find "$PS3DEV" -name "pkg.py" | head -n 1)

          if [[ "$FSELF_BIN" == *.py ]]; then
            python3 "$FSELF_BIN" -n rafstream_ps3.elf pkg_build/USRDIR/EBOOT.BIN
          else
            "$FSELF_BIN" rafstream_ps3.elf pkg_build/USRDIR/EBOOT.BIN UP0001-RAFSTRM01_00-RAFSTREAMPS30001
          fi

          python3 "$SFO_BIN" --title "RAFSTREAM PS3" --appid "RAFSTRM01" -f sfo.xml pkg_build/PARAM.SFO
          python3 "$PKG_BIN" --contentid UP0001-RAFSTRM01_00-RAFSTREAMPS30001 pkg_build/ RAFSTREAM_PS3.pkg
          ls -lh RAFSTREAM_PS3.pkg

      - name: Upload RAFSTREAM_PS3.pkg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAFSTREAM_PS3_PKG
          path: "*.pkg"
