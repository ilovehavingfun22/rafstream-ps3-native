name: Build RAFSTREAM PS3 Native PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ps3-pkg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Cached PS3DEV Toolchain
        uses: actions/cache@v4
        with:
          path: /usr/local/ps3dev
          key: ps3dev-prebuilt-v5

      - name: Setup PS3DEV & PSL1GHT Toolchain
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl python3 python-is-python3 \
            autoconf automake bison flex texinfo libncurses-dev \
            libgmp-dev libmpfr-dev libmpc-dev libssl-dev libtool pkg-config \
            zlib1g-dev bzip2 xz-utils ca-certificates jq cmake ninja-build

          sudo mkdir -p /usr/local/ps3dev
          sudo chown -R $USER:$USER /usr/local/ps3dev

          if [ ! -f "/usr/local/ps3dev/portlibs/ppu/lib/libcurl.a" ]; then
            rm -rf /tmp/ps3dev
            git clone --depth 1 https://github.com/ps3dev/ps3dev.git /tmp/ps3dev
            cd /tmp/ps3dev
            export PS3DEV=/usr/local/ps3dev
            export PSL1GHT=$PS3DEV/psl1ght
            export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin

            chmod +x ./prepare.sh ./build-all.sh ./scripts/*.sh
            ./prepare.sh || true

            for s in ./scripts/002-*.sh ./scripts/003-*.sh; do
              [ -f "$s" ] && sed -i '2i unset CFLAGS CXXFLAGS' "$s"
            done

            for s in ./scripts/003-*.sh; do
              [ -f "$s" ] && sed -i 's|./libraries.sh|rm -f scripts/*pthread-emb* \&\& ./libraries.sh|g' "$s"
            done

            export CFLAGS="-O2 -std=gnu11 -Wno-error"
            export CXXFLAGS="-O2 -std=gnu++14 -Wno-error"
            ./build-all.sh
          fi

      - name: Compile EBOOT.BIN & Build RAFSTREAM_PS3.pkg
        run: |
          set -e
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV/psl1ght
          export PORTLIBS=$PS3DEV/portlibs/ppu
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PORTLIBS/bin

          if [ ! -f "$PORTLIBS/include/libswresample/swresample.h" ]; then
            python3 -c '
          import re
          s = open("source/player.c").read()
          s = s.replace("#include <libswresample/swresample.h>", "")
          s = s.replace("SwrContext *swr = NULL;", "void *swr = NULL;")
          s = re.sub(r"swr\s*=\s*swr_alloc_set_opts\([^;]*\);", "swr = NULL;", s, flags=re.S)
          s = s.replace("swr_init(swr)", "-1")
          s = re.sub(r"swr_convert\([^;]*\)", "0", s, flags=re.S)
          s = s.replace("swr_free(&swr);", "")
          open("source/player.c", "w").write(s)
          '
          fi

          SSL_LIBS=""
          if [ -f "$PORTLIBS/lib/libmbedtls.a" ]; then
            SSL_LIBS="-lmbedtls -lmbedx509 -lmbedcrypto"
          elif [ -f "$PORTLIBS/lib/libpolarssl.a" ]; then
            SSL_LIBS="-lpolarssl"
          elif [ -f "$PORTLIBS/lib/libwolfssl.a" ]; then
            SSL_LIBS="-lwolfssl"
          fi

          FF_LIBS=""
          [ -f "$PORTLIBS/lib/libavformat.a" ] && FF_LIBS="$FF_LIBS -lavformat"
          [ -f "$PORTLIBS/lib/libavcodec.a" ] && FF_LIBS="$FF_LIBS -lavcodec"
          [ -f "$PORTLIBS/lib/libswscale.a" ] && FF_LIBS="$FF_LIBS -lswscale"
          [ -f "$PORTLIBS/lib/libswresample.a" ] && FF_LIBS="$FF_LIBS -lswresample"
          [ -f "$PORTLIBS/lib/libavutil.a" ] && FF_LIBS="$FF_LIBS -lavutil"

          make clean || true
          make CC=powerpc64-ps3-elf-gcc CXX=powerpc64-ps3-elf-g++ LD=powerpc64-ps3-elf-gcc \
               AR=powerpc64-ps3-elf-ar AS=powerpc64-ps3-elf-as \
               OBJCOPY=powerpc64-ps3-elf-objcopy STRIP=powerpc64-ps3-elf-strip \
               EXTRA_LIBS="$SSL_LIBS $FF_LIBS" rafstream_ps3.elf

          rm -rf pkg_build
          mkdir -p pkg_build/USRDIR
          cp ICON0.PNG pkg_build/ICON0.PNG
          [ -f PIC1.PNG ] && cp PIC1.PNG pkg_build/PIC1.PNG || true

          if command -v make_self_npdrm >/dev/null 2>&1; then
            make_self_npdrm rafstream_ps3.elf pkg_build/USRDIR/EBOOT.BIN UP0001-RAFSTRM01_00-RAFSTREAMPS30001
          else
            python3 "$PSL1GHT/bin/fself.py" -n rafstream_ps3.elf pkg_build/USRDIR/EBOOT.BIN
          fi

          python3 "$PSL1GHT/bin/sfo.py" --title "RAFSTREAM PS3" --appid "RAFSTRM01" -f sfo.xml pkg_build/PARAM.SFO
          python3 "$PSL1GHT/bin/pkg.py" --contentid UP0001-RAFSTRM01_00-RAFSTREAMPS30001 pkg_build/ RAFSTREAM_PS3.pkg
          ls -lh RAFSTREAM_PS3.pkg

      - name: Upload RAFSTREAM_PS3.pkg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAFSTREAM_PS3_PKG
          path: "*.pkg"
