name: Build RAFSTREAM PS3 Native PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ps3-pkg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Cached PS3DEV Toolchain
        id: cache-ps3dev
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/ps3dev
          key: ps3dev-prebuilt-v6

      - name: Setup PS3DEV & PSL1GHT Toolchain
        if: steps.cache-ps3dev.outputs.cache-hit != 'true'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl python3 python-is-python3 \
            autoconf automake bison flex texinfo libncurses-dev \
            libgmp-dev libmpfr-dev libmpc-dev libssl-dev libtool pkg-config \
            zlib1g-dev bzip2 xz-utils ca-certificates jq cmake ninja-build

          sudo mkdir -p /usr/local/ps3dev
          sudo chown -R $USER:$USER /usr/local/ps3dev

          if [ ! -f "/usr/local/ps3dev/portlibs/ppu/lib/libcurl.a" ]; then
            rm -rf /tmp/ps3dev
            git clone --depth 1 https://github.com/ps3dev/ps3dev.git /tmp/ps3dev
            cd /tmp/ps3dev
            export PS3DEV=/usr/local/ps3dev
            export PSL1GHT=$PS3DEV/psl1ght
            export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin

            chmod +x ./prepare.sh ./build-all.sh ./scripts/*.sh
            ./prepare.sh || true

            for s in ./scripts/002-*.sh ./scripts/003-*.sh; do
              [ -f "$s" ] && sed -i '2i unset CFLAGS CXXFLAGS' "$s"
            done

            for s in ./scripts/003-*.sh; do
              [ -f "$s" ] && sed -i 's|./libraries.sh|rm -f scripts/*pthread-emb* scripts/*mikmod* scripts/*[Ss][Dd][Ll]* scripts/*lua* scripts/*zip* scripts/*xml2* scripts/*cairo* scripts/*pixman* scripts/*tiff* scripts/*webp* scripts/*ogg* scripts/*vorbis* scripts/*theora* scripts/*flac* \&\& ./libraries.sh|g' "$s"
            done

            export CFLAGS="-O2 -std=gnu11 -Wno-error"
            export CXXFLAGS="-O2 -std=gnu++14 -Wno-error"
            ./build-all.sh
          fi

      - name: Save PS3DEV Toolchain Cache
        if: success() && steps.cache-ps3dev.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /usr/local/ps3dev
          key: ps3dev-prebuilt-v6

      - name: Restore Cached FFmpeg Portlib
        id: cache-ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/ps3dev/portlibs/ppu
          key: ps3dev-ffmpeg-v2

      - name: Build FFmpeg for PS3 (PPU)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          set -e
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV/psl1ght
          export PORTLIBS=$PS3DEV/portlibs/ppu
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PORTLIBS/bin

          if [ ! -f "$PORTLIBS/include/libavformat/avformat.h" ]; then
            rm -rf /tmp/ps3_compat_inc
            mkdir -p /tmp/ps3_compat_inc/netinet
            printf '#ifndef _PS3_COMPAT_NETINET_TCP_H\n#define _PS3_COMPAT_NETINET_TCP_H\n#ifndef TCP_NODELAY\n#define TCP_NODELAY 1\n#endif\n#ifndef TCP_MAXSEG\n#define TCP_MAXSEG 2\n#endif\n#ifndef IPPROTO_TCP\n#define IPPROTO_TCP 6\n#endif\n#endif\n' > /tmp/ps3_compat_inc/netinet/tcp.h

            rm -rf /tmp/ffmpeg*
            if curl -fSL https://ffmpeg.org/releases/ffmpeg-6.1.2.tar.xz -o /tmp/ffmpeg.tar.xz; then
              mkdir -p /tmp/ffmpeg
              tar -xaf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
            else
              git clone --depth 1 --branch n6.1.2 https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg
            fi

            cd /tmp/ffmpeg
            COMMON_FLAGS="--prefix=$PORTLIBS \
              --enable-cross-compile \
              --cross-prefix=powerpc64-ps3-elf- \
              --arch=powerpc64 \
              --cpu=cell \
              --target-os=none \
              --enable-static \
              --disable-shared \
              --disable-programs \
              --disable-doc \
              --disable-avdevice \
              --disable-postproc \
              --disable-avfilter \
              --disable-encoders \
              --disable-muxers \
              --disable-devices \
              --disable-protocols \
              --enable-protocol=file,http,https,tls,tcp,hls,crypto,data \
              --disable-pthreads \
              --disable-w32threads \
              --disable-os2threads \
              --disable-altivec \
              --disable-vsx \
              --disable-asm \
              --enable-zlib"

            EXTRA_CF="-O2 -D_GNU_SOURCE -Dasm=__asm__ -Dinline=__inline__ -Dtypeof=__typeof__ -Dclosesocket=close -include sys/time.h -include unistd.h -I$PSL1GHT/ppu/include -I$PORTLIBS/include -I/tmp/ps3_compat_inc"
            EXTRA_LF="-L$PSL1GHT/ppu/lib -L$PORTLIBS/lib"

            if [ -f "$PORTLIBS/lib/libmbedtls.a" ] && ./configure $COMMON_FLAGS --enable-version3 --enable-network --enable-mbedtls --extra-cflags="$EXTRA_CF" --extra-ldflags="$EXTRA_LF" --extra-libs="-lmbedtls -lmbedx509 -lmbedcrypto -lnet -lsysmodule -lz -lm"; then
              echo "Configured FFmpeg with mbedTLS v3 + network"
            elif ./configure $COMMON_FLAGS --enable-network --extra-cflags="$EXTRA_CF" --extra-ldflags="$EXTRA_LF" --extra-libs="-lnet -lsysmodule -lz -lm"; then
              echo "Configured FFmpeg with network"
            else
              ./configure $COMMON_FLAGS --disable-network --extra-cflags="$EXTRA_CF" --extra-ldflags="$EXTRA_LF" --extra-libs="-lz -lm"
            fi

            sed -i 's/-Werror=implicit-function-declaration/-Wno-error/g' ffbuild/config.mak
            make -j$(nproc)
            make install
          fi

      - name: Save FFmpeg Portlib Cache
        if: success() && steps.cache-ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /usr/local/ps3dev/portlibs/ppu
          key: ps3dev-ffmpeg-v2

      - name: Compile EBOOT.BIN & Build RAFSTREAM_PS3.pkg
        run: |
          set -e
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV/psl1ght
          export PORTLIBS=$PS3DEV/portlibs/ppu
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PORTLIBS/bin

          # Gunakan specs / linker script resmi PSL1GHT LV2 agar format ELF valid untuk PS3 & RPCS3
          SPEC_FLAG="-B$PSL1GHT/ppu/lib/"
          if [ -f "$PSL1GHT/ppu/lib/specs" ]; then
            SPEC_FLAG="-B$PSL1GHT/ppu/lib/ -specs=$PSL1GHT/ppu/lib/specs"
          elif [ -f "$PSL1GHT/ppu/lib/lv2.ld" ]; then
            SPEC_FLAG="-B$PSL1GHT/ppu/lib/ -T$PSL1GHT/ppu/lib/lv2.ld"
          fi
          echo "Using PSL1GHT linker flags: $SPEC_FLAG"

          MACHDEP="-mcpu=cell -mhard-float -ffunction-sections -fdata-sections $SPEC_FLAG"

          LIBS="-ltiny3d -lrsx -lgcm_sys -ljpgdec -lpngdec -lcurl"
          [ -f "$PORTLIBS/lib/libavformat.a" ] && LIBS="$LIBS -lavformat"
          [ -f "$PORTLIBS/lib/libavcodec.a" ] && LIBS="$LIBS -lavcodec"
          [ -f "$PORTLIBS/lib/libswscale.a" ] && LIBS="$LIBS -lswscale"
          [ -f "$PORTLIBS/lib/libswresample.a" ] && LIBS="$LIBS -lswresample"
          [ -f "$PORTLIBS/lib/libavutil.a" ] && LIBS="$LIBS -lavutil"
          if [ -f "$PORTLIBS/lib/libmbedtls.a" ]; then
            LIBS="$LIBS -lmbedtls -lmbedx509 -lmbedcrypto"
          elif [ -f "$PORTLIBS/lib/libpolarssl.a" ]; then
            LIBS="$LIBS -lpolarssl"
          elif [ -f "$PORTLIBS/lib/libwolfssl.a" ]; then
            LIBS="$LIBS -lwolfssl"
          fi
          LIBS="$LIBS -lz -laudio -lnet"
          [ -f "$PSL1GHT/ppu/lib/libnetctl.a" ] && LIBS="$LIBS -lnetctl"
          LIBS="$LIBS -lio -lsysutil -lsysmodule"
          [ -f "$PSL1GHT/ppu/lib/librt.a" ] && LIBS="$LIBS -lrt"
          [ -f "$PSL1GHT/ppu/lib/liblv2.a" ] && LIBS="$LIBS -llv2"
          LIBS="$LIBS -lm"

          rm -rf build pkg_build rafstream_ps3.elf RAFSTREAM_PS3.pkg
          mkdir -p build pkg_build/USRDIR

          printf '#include <stddef.h>\n#include <string.h>\nint gethostname(char *name, size_t len) {\n  if (name && len > 0) {\n    strncpy(name, "ps3", len - 1);\n    name[len - 1] = 0;\n  }\n  return 0;\n}\n' > build/ps3_compat.c
          powerpc64-ps3-elf-gcc $MACHDEP -O2 -c build/ps3_compat.c -o build/ps3_compat.o

          for src in source/*.c; do
            obj="build/$(basename "${src%.c}.o")"
            echo "Compiling $src -> $obj"
            powerpc64-ps3-elf-gcc $MACHDEP -O2 -Wall -Iinclude -Isource \
              -I"$PSL1GHT/ppu/include" -I"$PORTLIBS/include" \
              -c "$src" -o "$obj"
          done

          echo "Linking rafstream_ps3.elf..."
          powerpc64-ps3-elf-gcc $MACHDEP build/*.o \
            -L"$PSL1GHT/ppu/lib" -L"$PORTLIBS/lib" \
            -Wl,--gc-sections \
            $LIBS -o rafstream_ps3.elf

          powerpc64-ps3-elf-readelf -h -l rafstream_ps3.elf

          ICON_FILE=$(find . -maxdepth 2 -iname "ICON0.PNG" | head -n 1)
          [ -n "$ICON_FILE" ] && cp "$ICON_FILE" pkg_build/ICON0.PNG
          PIC_FILE=$(find . -maxdepth 2 -iname "PIC1.PNG" | head -n 1)
          [ -n "$PIC_FILE" ] && cp "$PIC_FILE" pkg_build/PIC1.PNG

          # Gunakan Free Homebrew NPDRM ContentID (HB0001-) seperti Yo! Player
          CONTENT_ID="HB0001-RAFSTRM01_00-RAFSTREAMPS30001"
          if command -v make_self_npdrm >/dev/null 2>&1; then
            echo "Signing EBOOT.BIN with make_self_npdrm ($CONTENT_ID)..."
            make_self_npdrm rafstream_ps3.elf pkg_build/USRDIR/EBOOT.BIN "$CONTENT_ID"
          elif command -v make_fself >/dev/null 2>&1; then
            make_fself rafstream_ps3.elf pkg_build/USRDIR/EBOOT.BIN
          else
            FSELF_PY=$(find "$PS3DEV" -name "fself.py" | head -n 1)
            python3 "$FSELF_PY" -n rafstream_ps3.elf pkg_build/USRDIR/EBOOT.BIN
          fi
          test -s pkg_build/USRDIR/EBOOT.BIN

          cat << 'PYEOF' > build/make_sfo.py
          import struct

          entries = [
              ("APP_VER", 0x0204, b"01.00\x00", 8),
              ("ATTRIBUTE", 0x0404, struct.pack("<I", 0), 4),
              ("BOOTABLE", 0x0404, struct.pack("<I", 1), 4),
              ("CATEGORY", 0x0204, b"HG\x00", 4),
              ("LICENSE", 0x0204, b"RAFSTREAM PS3 Homebrew.\x00", 512),
              ("PARENTAL_LEVEL", 0x0404, struct.pack("<I", 1), 4),
              ("PS3_SYSTEM_VER", 0x0204, b"04.7500\x00", 8),
              ("RESOLUTION", 0x0404, struct.pack("<I", 63), 4),
              ("SOUND_FORMAT", 0x0404, struct.pack("<I", 1), 4),
              ("TITLE", 0x0204, b"RAFSTREAM PS3\x00", 128),
              ("TITLE_ID", 0x0204, b"RAFSTRM01\x00", 16),
              ("VERSION", 0x0204, b"01.00\x00", 8),
          ]
          entries.sort(key=lambda x: x[0])

          key_table = bytearray()
          data_table = bytearray()
          index_table = bytearray()
          for k, fmt, val, max_len in entries:
              k_off = len(key_table)
              key_table.extend(k.encode("ascii") + b"\x00")
              d_off = len(data_table)
              data_table.extend(val.ljust(max_len, b"\x00"))
              index_table.extend(struct.pack("<HHIII", k_off, fmt, len(val), max_len, d_off))
          while len(key_table) % 4 != 0:
              key_table.append(0)

          key_off = 20 + len(index_table)
          data_off = key_off + len(key_table)
          sfo_hdr = struct.pack("<4sIIII", b"\x00PSF", 0x00000101, key_off, data_off, len(entries))
          with open("pkg_build/PARAM.SFO", "wb") as f:
              f.write(sfo_hdr + index_table + key_table + data_table)
          PYEOF
          python3 build/make_sfo.py
          test -s pkg_build/PARAM.SFO

          rm -rf /tmp/psl1ght_tools
          git clone --depth 1 --filter=blob:none --sparse https://github.com/ps3dev/PSL1GHT.git /tmp/psl1ght_tools
          git -C /tmp/psl1ght_tools sparse-checkout set tools/ps3py
          make -C /tmp/psl1ght_tools/tools/ps3py
          PYTHONPATH=/tmp/psl1ght_tools/tools/ps3py python3 /tmp/psl1ght_tools/tools/ps3py/pkg.py \
            --contentid "$CONTENT_ID" \
            pkg_build/ RAFSTREAM_PS3.pkg

          ls -lh pkg_build pkg_build/USRDIR RAFSTREAM_PS3.pkg

      - name: Upload RAFSTREAM_PS3.pkg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAFSTREAM_PS3_PKG
          path: "*.pkg"
